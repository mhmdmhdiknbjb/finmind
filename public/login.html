<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ورود | فین‌مایند</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="auth-wrap">
  <svg class="mountain-scene" viewBox="0 0 1200 500" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs>
      <radialGradient id="skyGlow" cx="50%" cy="0%" r="80%">
        <stop offset="0%" stop-color="#1B5C6E" stop-opacity="1" />
        <stop offset="45%" stop-color="#153F52" stop-opacity="0.75" />
        <stop offset="100%" stop-color="#0A0E17" stop-opacity="0" />
      </radialGradient>
      <linearGradient id="mtBack" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7C9CD6" /><stop offset="100%" stop-color="#3C5486" /></linearGradient>
      <linearGradient id="mtMid" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4A5F92" /><stop offset="100%" stop-color="#232F52" /></linearGradient>
      <linearGradient id="mtFront" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1C2440" /><stop offset="100%" stop-color="#0A0E19" /></linearGradient>
      <linearGradient id="pathGlow" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#00F0FF" /><stop offset="100%" stop-color="#00D4AA" /></linearGradient>
      <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#BFEFE8" stop-opacity="0.9" />
        <stop offset="55%" stop-color="#7FD8CF" stop-opacity="0.25" />
        <stop offset="100%" stop-color="#7FD8CF" stop-opacity="0" />
      </radialGradient>
      <filter id="softBlur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6" /></filter>
    </defs>
    <rect x="0" y="0" width="1200" height="500" fill="url(#skyGlow)" />
    <circle cx="920" cy="80" r="70" fill="url(#moonGlow)" />
    <circle cx="920" cy="80" r="26" fill="#EAF9F6" opacity="0.95" />
    <circle cx="200" cy="60" r="45" fill="url(#moonGlow)" />
    <circle cx="200" cy="60" r="14" fill="#EAF9F6" opacity="0.7" />
    <circle cx="20" cy="10" r="2.2" fill="#fff" opacity="0.35"/><circle cx="157" cy="93" r="1.2" fill="#fff" opacity="0.47"/><circle cx="294" cy="176" r="1.2" fill="#fff" opacity="0.59"/><circle cx="431" cy="259" r="1.2" fill="#fff" opacity="0.71"/><circle cx="568" cy="82" r="1.2" fill="#fff" opacity="0.83"/><circle cx="705" cy="165" r="1.2" fill="#fff" opacity="0.35"/><circle cx="842" cy="248" r="2.2" fill="#fff" opacity="0.47"/><circle cx="979" cy="71" r="1.2" fill="#fff" opacity="0.59"/><circle cx="1116" cy="154" r="1.2" fill="#fff" opacity="0.71"/><circle cx="53" cy="237" r="1.2" fill="#fff" opacity="0.83"/><circle cx="190" cy="60" r="1.2" fill="#fff" opacity="0.35"/><circle cx="327" cy="143" r="1.2" fill="#fff" opacity="0.47"/><circle cx="464" cy="226" r="2.2" fill="#fff" opacity="0.59"/><circle cx="601" cy="49" r="1.2" fill="#fff" opacity="0.71"/><circle cx="738" cy="132" r="1.2" fill="#fff" opacity="0.83"/><circle cx="875" cy="215" r="1.2" fill="#fff" opacity="0.35"/><circle cx="1012" cy="38" r="1.2" fill="#fff" opacity="0.47"/><circle cx="1149" cy="121" r="1.2" fill="#fff" opacity="0.59"/><circle cx="86" cy="204" r="2.2" fill="#fff" opacity="0.71"/><circle cx="223" cy="27" r="1.2" fill="#fff" opacity="0.83"/><circle cx="360" cy="110" r="1.2" fill="#fff" opacity="0.35"/><circle cx="497" cy="193" r="1.2" fill="#fff" opacity="0.47"/><circle cx="634" cy="16" r="1.2" fill="#fff" opacity="0.59"/><circle cx="771" cy="99" r="1.2" fill="#fff" opacity="0.71"/><circle cx="908" cy="182" r="2.2" fill="#fff" opacity="0.83"/><circle cx="1045" cy="5" r="1.2" fill="#fff" opacity="0.35"/><circle cx="1182" cy="88" r="1.2" fill="#fff" opacity="0.47"/><circle cx="119" cy="171" r="1.2" fill="#fff" opacity="0.59"/><circle cx="256" cy="254" r="1.2" fill="#fff" opacity="0.71"/><circle cx="393" cy="77" r="1.2" fill="#fff" opacity="0.83"/><circle cx="530" cy="160" r="2.2" fill="#fff" opacity="0.35"/><circle cx="667" cy="243" r="1.2" fill="#fff" opacity="0.47"/><circle cx="804" cy="66" r="1.2" fill="#fff" opacity="0.59"/><circle cx="941" cy="149" r="1.2" fill="#fff" opacity="0.71"/><circle cx="1078" cy="232" r="1.2" fill="#fff" opacity="0.83"/><circle cx="15" cy="55" r="1.2" fill="#fff" opacity="0.35"/><circle cx="152" cy="138" r="2.2" fill="#fff" opacity="0.47"/><circle cx="289" cy="221" r="1.2" fill="#fff" opacity="0.59"/><circle cx="426" cy="44" r="1.2" fill="#fff" opacity="0.71"/><circle cx="563" cy="127" r="1.2" fill="#fff" opacity="0.83"/><circle cx="700" cy="210" r="1.2" fill="#fff" opacity="0.35"/><circle cx="837" cy="33" r="1.2" fill="#fff" opacity="0.47"/><circle cx="974" cy="116" r="2.2" fill="#fff" opacity="0.59"/><circle cx="1111" cy="199" r="1.2" fill="#fff" opacity="0.71"/><circle cx="48" cy="22" r="1.2" fill="#fff" opacity="0.83"/><circle cx="185" cy="105" r="1.2" fill="#fff" opacity="0.35"/><circle cx="322" cy="188" r="1.2" fill="#fff" opacity="0.47"/><circle cx="459" cy="11" r="1.2" fill="#fff" opacity="0.59"/><circle cx="596" cy="94" r="2.2" fill="#fff" opacity="0.71"/><circle cx="733" cy="177" r="1.2" fill="#fff" opacity="0.83"/><circle cx="870" cy="0" r="1.2" fill="#fff" opacity="0.35"/><circle cx="1007" cy="83" r="1.2" fill="#fff" opacity="0.47"/><circle cx="1144" cy="166" r="1.2" fill="#fff" opacity="0.59"/><circle cx="81" cy="249" r="1.2" fill="#fff" opacity="0.71"/><circle cx="218" cy="72" r="2.2" fill="#fff" opacity="0.83"/>
    <path d="M0 320 L120 250 L220 300 L340 210 L460 290 L580 230 L700 300 L820 240 L940 300 L1060 250 L1200 310 L1200 500 L0 500 Z" fill="url(#mtBack)" />
    <path d="M0 380 L150 300 L280 360 L420 270 L560 350 L700 280 L840 360 L980 290 L1120 350 L1200 320 L1200 500 L0 500 Z" fill="url(#mtMid)" />
    <path d="M600 500 C 560 430, 640 400, 600 340 C 560 290, 660 260, 620 200" fill="none" stroke="url(#pathGlow)" stroke-width="10" stroke-linecap="round" opacity="0.45" filter="url(#softBlur)" />
    <path d="M600 500 C 560 430, 640 400, 600 340 C 560 290, 660 260, 620 200" fill="none" stroke="url(#pathGlow)" stroke-width="3" stroke-linecap="round" opacity="0.85" />
    <path d="M0 440 L180 380 L320 430 L480 360 L620 430 L780 370 L940 435 L1100 380 L1200 420 L1200 500 L0 500 Z" fill="url(#mtFront)" />
  </svg>

  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-icon"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z"/></svg></div>
      <div><h1 style="margin:0;font-size:17px;">فین‌مایند</h1></div>
    </div>

    <h2 id="authTitle">ورود به حساب کاربری</h2>
    <p class="auth-sub" id="authSub">برای دسترسی به پنل مالی‌ات وارد شو</p>

    <div class="auth-error hidden" id="authError"></div>

    <form class="auth-form" id="authForm">
      <label class="hidden" id="nameField">نام
        <input type="text" id="authName" placeholder="مثلاً مهدی شکوهی" autocomplete="name" />
      </label>
      <label>ایمیل
        <input type="email" id="authEmail" placeholder="you@example.com" autocomplete="email" required />
      </label>
      <label>رمز عبور
        <input type="password" id="authPassword" placeholder="حداقل ۶ کاراکتر" autocomplete="current-password" required />
      </label>
      <button class="btn btn-primary" type="submit" id="authSubmitBtn">ورود</button>
    </form>

    <div class="auth-switch">
      <span id="authSwitchText">حساب کاربری نداری؟</span>
      <a href="#" id="authSwitchLink">همین الان ثبت‌نام کن</a>
    </div>
  </div>
</div>

<script type="module" src="login.js"></script>
</body>
</html>
