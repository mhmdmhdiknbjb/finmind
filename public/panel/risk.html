<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="/logo.png" />
<title>ریسک‌سنجی | چقدر</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../style.css" />
</head>
<body data-page="risk">

<div class="panel-shell">
  <aside class="panel-sidebar" id="panelSidebar"></aside>
  <div class="panel-main">
    <header class="panel-topbar" id="panelTopbar"></header>
    <main class="panel-content">

      <section class="card span-12" id="riskCard">
        <div class="card-head">
          <h2><span class="ico icon-badge icon-tone-rose icon-badge-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.9" fill="currentColor" stroke="none"/></svg></span> ریسک سبد دارایی <span class="engine-tag">محاسبه‌شده</span></h2>
          <button class="btn btn-ghost btn-small" id="refreshRiskBtn">محاسبه مجدد</button>
        </div>
        <div class="card-body">
          <div class="loading" id="riskLoading">در حال محاسبه ریسک...</div>
          <div id="riskContent" class="hidden">
            <div class="risk-top-row">
              <div class="risk-gauge-wrap">
                <div class="risk-gauge">
                  <svg viewBox="0 0 180 180">
                    <circle cx="90" cy="90" r="70" fill="transparent" stroke="#1c2438" stroke-width="14" />
                    <circle id="riskGaugeArc" cx="90" cy="90" r="70" fill="transparent" stroke="url(#riskGaugeGrad)" stroke-width="14" stroke-linecap="round" style="transition: stroke-dashoffset 1s ease-out;" />
                    <defs>
                      <linearGradient id="riskGaugeGrad" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#00F0FF" />
                        <stop offset="50%" stop-color="#00D4AA" />
                        <stop offset="100%" stop-color="#fb923c" />
                      </linearGradient>
                    </defs>
                  </svg>
                  <div class="risk-gauge-value">
                    <span class="risk-gauge-num" id="riskGaugeNum">۰</span>
                    <span class="risk-gauge-label" id="riskGaugeLevel">—</span>
                  </div>
                </div>
                <div class="risk-gauge-title">ریسک فعلی سبد دارایی</div>
              </div>

              <div class="risk-meters">
                <div class="meter-row">
                  <div class="meter-label">ریسک فعلی <b id="riskCurrentVal">0</b></div>
                  <div class="meter-track"><div class="meter-fill meter-current" id="riskCurrentBar"></div></div>
                </div>
                <div class="meter-row">
                  <div class="meter-label">ریسک پیشنهادی <b id="riskSuggestedVal">0</b></div>
                  <div class="meter-track"><div class="meter-fill meter-suggested" id="riskSuggestedBar"></div></div>
                </div>
                <div class="risk-badges">
                  <span class="badge" id="riskLevelBadge">—</span>
                  <span class="badge badge-outline" id="riskDiffBadge">—</span>
                </div>
              </div>
            </div>
            <div class="banner banner-adjust hidden" id="behaviorBanner"></div>

            <div id="marketRiskBlock" class="hidden">
              <h4 class="tag-neu">ریسک واقعی گذشته‌ی بخش قیمت‌دار <span class="profile-summary" id="marketRiskAsOf"></span></h4>
              <div class="stat-row" id="marketRiskStats"></div>
              <h4 class="tag-neu">بازه‌ی تاریخی محتمل (بر پایه‌ی نوسان گذشته؛ پیش‌بینی نیست)</h4>
              <div class="range-table-wrap">
                <table class="range-table">
                  <thead><tr><th>افق</th><th>بازده اسمی</th><th>بیشینه ریزش</th><th>بازده نسبت به دلار</th></tr></thead>
                  <tbody id="forwardRangeBody"></tbody>
                </table>
              </div>
              <p class="summary-text" id="marketRiskNotes"></p>
            </div>

            <h4 class="tag-neu">دلایل</h4>
            <ul id="riskReasons"></ul>
            <h4 class="tag-neu">رفتارهای اقتصادی موثر</h4>
            <ul id="riskBehavioral"></ul>
            <h4 class="tag-sug">پیشنهادها</h4>
            <ul id="riskSuggestions"></ul>
            <p class="summary-text" id="riskSummary"></p>
          </div>
        </div>
      </section>

    </main>
  </div>
</div>

<script type="module" src="risk-page.js"></script>
</body>
</html>
