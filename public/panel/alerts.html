<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>هشدارهای رفتاری | فین‌مایند</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<div class="panel-shell">
  <aside class="panel-sidebar" id="panelSidebar"></aside>
  <div class="panel-main">

    <main class="panel-content">

      <section class="card span-12 emotional-card" id="emotionalCard">
        <div class="card-head">
          <h2><span class="ico">⚠️</span> هشدار تصمیم‌های هیجانی</h2>
        </div>
        <div class="card-body">
          <p style="font-size:12.5px;color:var(--text-dim);margin-top:0;">وقتی پیامی که در گفتگو با دستیار مالی می‌فرستی نشانه‌ی یک واکنش هیجانی یا آنی به نوسان بازار باشد، اینجا ثبت می‌شود.</p>
          <div id="emotionalEmpty" class="loading hidden">تا الان هیچ هشداری ثبت نشده — عالیه 👍</div>
          <div id="emotionalList" class="emotional-list"></div>
        </div>
      </section>

    </main>
  </div>

<script type="module" src="alerts-page.js"></script>
