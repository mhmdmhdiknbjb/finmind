<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="/logo.png" />
<title>اهداف مالی | چقدر</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../style.css" />
</head>
<body data-page="goals">

<div class="panel-shell">
  <aside class="panel-sidebar" id="panelSidebar"></aside>
  <div class="panel-main">
    <header class="panel-topbar" id="panelTopbar"></header>
    <main class="panel-content">

      <section class="card span-12" id="goalsCard">
        <div class="card-head">
          <h2><span class="ico icon-badge icon-tone-teal icon-badge-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M5 3v18"/><path d="M5 4h11l-2.5 3.5L16 11H5"/></svg></span> اهداف مالی من</h2>
        </div>
        <div class="card-body">
          <div class="goal-add-form">
            <input id="goalTitle" placeholder="عنوان هدف، مثلاً خرید خانه" />
            <input id="goalAmount" type="number" placeholder="مبلغ هدف (میلیون تومان)" />
            <input id="goalMonths" type="number" placeholder="مهلت (ماه)" />
            <input id="goalGrowth" type="number" placeholder="رشد سالانه‌ی قیمت هدف (٪) — خالی = فرض ۳۰٪" title="مثلاً قیمت مسکن یا خودرو سالی چند درصد گران می‌شود؛ اگر هدف تورم ندارد ۰ بنویسید" />
            <button class="btn btn-primary btn-small" id="addGoalBtn">افزودن هدف</button>
          </div>
          <p class="profile-summary" style="margin:-6px 0 14px;font-size:11.5px;">اگر «رشد سالانه‌ی قیمت هدف» را خالی بگذاری، محاسبه با فرض ۳۰٪ رشد سالانه انجام می‌شود (یعنی فرض می‌کند چیزی که می‌خواهی بخری — مثلاً خانه — هر سال ۳۰٪ گران‌تر می‌شود). اگر هدفت گران نمی‌شود (مثلاً فقط پس‌انداز خالص)، عدد ۰ را وارد کن.</p>
          <div id="goalsList" class="goals-list"></div>
        </div>
      </section>

    </main>
  </div>
</div>

<script type="module" src="goals-page.js"></script>
</body>
</html>
